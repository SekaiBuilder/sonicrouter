name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Process taps need the macOS 14.2+ SDK; the project is built with
    # Xcode 27.2 / Swift 6.4 locally. Runner images may lag behind.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Scripts/ci.sh
        run: Scripts/ci.sh
